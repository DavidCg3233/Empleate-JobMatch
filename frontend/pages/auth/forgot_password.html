<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña | Empléate Jobmatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="../../favicon.ico" />
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <script src="../../assets/js/utils/theme.js"></script>
</head>
<body class="auth-page">

  <button type="button" class="theme-toggle" data-theme-toggle aria-label="Cambiar tema"></button>

  <main class="card auth-card">
    <header class="auth-header">
      <h1 class="brand">Empléate <span>Jobmatch</span></h1>
      <p class="brand-tagline">Recupera el acceso a tu cuenta</p>
    </header>

    <form id="forgot-form" class="stack" novalidate>
      <p class="text-muted">Escribe el correo con el que te registraste y te enviaremos un enlace para crear una nueva contraseña.</p>

      <div class="field">
        <label for="email" class="label">Correo electrónico</label>
        <input id="email" type="email" class="input" required autocomplete="email" placeholder="tucorreo@ejemplo.com" />
      </div>

      <div id="error-box" role="alert" class="alert alert-error hidden"></div>

      <button id="submit-btn" type="submit" class="btn btn-primary btn-block">Enviar enlace</button>
    </form>

    <div id="sent-box" class="stack hidden" role="status">
      <p class="alert alert-success" id="sent-message"></p>
      <p class="hint">Revisa también la carpeta de spam. El enlace vence en 30 minutos.</p>
      <button id="resend-btn" type="button" class="btn btn-outline btn-block">Usar otro correo</button>
    </div>

    <p class="auth-footer">
      <a href="login.html">Volver a iniciar sesión</a>
    </p>
  </main>

  <script type="module" src="../../assets/js/controllers/forgotPasswordController.js"></script>
</body>
</html>
