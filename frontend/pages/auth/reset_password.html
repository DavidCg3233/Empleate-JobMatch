<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva contraseña | Empléate Jobmatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="../../favicon.ico" />
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <script src="../../assets/js/utils/theme.js"></script>
</head>
<body class="auth-page">

  <button type="button" class="theme-toggle" data-theme-toggle aria-label="Cambiar tema"></button>

  <main class="card auth-card">
    <header class="auth-header">
      <h1 class="brand">Empléate <span>Jobmatch</span></h1>
      <p class="brand-tagline">Crea una nueva contraseña</p>
    </header>

    <p id="checking" class="text-center text-muted"><span class="spinner"></span><br />Verificando el enlace...</p>

    <div id="invalid-box" class="stack hidden">
      <p class="alert alert-error" id="invalid-message"></p>
      <a href="forgot_password.html" class="btn btn-primary btn-block">Solicitar un nuevo enlace</a>
    </div>

    <form id="reset-form" class="stack hidden" novalidate>
      <div class="field">
        <label for="password" class="label">Nueva contraseña</label>
        <div class="input-group">
          <input id="password" type="password" class="input" autocomplete="new-password" />
          <button type="button" class="input-toggle" data-toggle-password>Mostrar</button>
        </div>
        <p class="hint">Mínimo 8 caracteres, con letras y números.</p>
        <p class="field-error hidden" id="password-error"></p>
      </div>

      <div class="field">
        <label for="confirm" class="label">Confirmar contraseña</label>
        <div class="input-group">
          <input id="confirm" type="password" class="input" autocomplete="new-password" />
          <button type="button" class="input-toggle" data-toggle-password>Mostrar</button>
        </div>
        <p class="field-error hidden" id="confirm-error"></p>
      </div>

      <div id="error-box" role="alert" class="alert alert-error hidden"></div>
      <div id="success-box" role="status" class="alert alert-success hidden"></div>

      <button id="submit-btn" type="submit" class="btn btn-primary btn-block">Guardar contraseña</button>
    </form>

    <p class="auth-footer">
      <a href="login.html">Volver a iniciar sesión</a>
    </p>
  </main>

  <script type="module" src="../../assets/js/controllers/resetPasswordController.js"></script>
</body>
</html>
