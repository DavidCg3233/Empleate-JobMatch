<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actividad | Empléate Jobmatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="../../favicon.ico" />
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/swipe.css" />
  <link rel="stylesheet" href="../../assets/css/admin.css" />
  <script src="../../assets/js/utils/theme.js"></script>
</head>
<body>

  <main class="container page-main admin-page">
    <div class="page-header-row">
      <header class="page-header">
        <h1 class="page-title">Actividad</h1>
        <p class="hint">Bitácora de acciones en la plataforma. No guarda contraseñas ni el contenido de las hojas de vida.</p>
      </header>
    </div>
    <div id="error-box" role="alert" class="alert alert-error hidden"></div>

    <div class="toolbar" role="search">
      <select id="action" class="select" aria-label="Tipo de acción">
        <option value="">Todas las acciones</option>
      </select>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th scope="col">Acción</th>
            <th scope="col">Quién</th>
            <th scope="col">Detalle</th>
            <th scope="col">Fecha</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination" aria-live="polite"></div>

  </main>

  <script type="module" src="../../assets/js/controllers/adminActivityController.js"></script>
</body>
</html>
