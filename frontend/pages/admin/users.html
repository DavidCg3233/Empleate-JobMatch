<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuarios | Empléate Jobmatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="../../favicon.ico" />
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/swipe.css" />
  <link rel="stylesheet" href="../../assets/css/admin.css" />
  <script src="../../assets/js/utils/theme.js"></script>
</head>
<body>

  <main class="container page-main admin-page">
    <div class="page-header-row">
      <header class="page-header">
        <h1 class="page-title">Usuarios</h1>
        <p class="hint">Aspirantes y empresas registrados. Desactiva una cuenta para que no pueda entrar ni aparecer en el emparejamiento.</p>
      </header>
    </div>
    <div id="error-box" role="alert" class="alert alert-error hidden"></div>

    <div class="toolbar" role="search">
      <input id="q" type="search" class="input" placeholder="Nombre, correo o NIT" aria-label="Buscar" maxlength="100" />
      <select id="role" class="select" aria-label="Rol">
        <option value="">Todos los roles</option>
        <option value="aspirante">Aspirantes</option>
        <option value="empresa">Empresas</option>
        <option value="administrador">Administradores</option>
      </select>
      <select id="status" class="select" aria-label="Estado">
        <option value="">Todos los estados</option>
        <option value="activo">Activas</option>
        <option value="inactivo">Desactivadas</option>
        <option value="bloqueado">Bloqueadas por intentos</option>
      </select>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th scope="col">Usuario</th>
            <th scope="col">Rol</th>
            <th scope="col">Estado</th>
            <th scope="col">Último ingreso</th>
            <th scope="col">Registro</th>
            <th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination" aria-live="polite"></div>

  </main>

  <script type="module" src="../../assets/js/controllers/adminUsersController.js"></script>
</body>
</html>
