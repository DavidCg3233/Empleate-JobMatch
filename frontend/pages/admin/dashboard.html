<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel del administrador | Empléate Jobmatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="../../favicon.ico" />
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/swipe.css" />
  <link rel="stylesheet" href="../../assets/css/admin.css" />
  <script src="../../assets/js/utils/theme.js"></script>
</head>
<body>

  <main class="container page-main admin-page">
    <div class="page-header-row">
      <header class="page-header">
        <h1 class="page-title">Resumen</h1>
        <p class="hint">Cómo va la plataforma: usuarios, vacantes, matches y lo último que pasó.</p>
      </header>
    </div>
    <div id="error-box" role="alert" class="alert alert-error hidden"></div>

    <section class="stats-grid" id="stats" aria-label="Indicadores">
      <div class="results-empty"><span class="spinner" aria-hidden="true"></span></div>
    </section>

    <div class="panel-grid">
      <section class="chart-card" aria-labelledby="signups-title">
        <h2 class="panel-title" id="signups-title">Registros de los últimos 14 días</h2>
        <div id="signups"></div>
      </section>
      <section class="chart-card" aria-labelledby="activity-title">
        <h2 class="panel-title" id="activity-title">Actividad reciente</h2>
        <ul class="activity-list" id="activity"></ul>
        <a href="activity.html" class="btn btn-ghost btn-sm mt-2">Ver toda la actividad</a>
      </section>
    </div>

  </main>

  <script type="module" src="../../assets/js/controllers/adminController.js"></script>
</body>
</html>
